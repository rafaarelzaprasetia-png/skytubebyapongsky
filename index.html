<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f0f0f',
                        surfacedark: '#212121',
                        borderdark: '#3f3f3f',
                        hoverdark: '#272727',
                        skylred: '#ff0000'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f3f;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-darkbg/95 backdrop-blur-md border-b border-borderdark px-4 h-14 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button id="hamburger-btn" class="p-2 hover:bg-hoverdark rounded-full transition text-gray-300 hover:text-white focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <a href="#" class="flex items-center space-x-1.5 group">
                <div class="bg-red-600 text-white p-1.5 rounded-xl flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-play text-sm"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white group-hover:text-red-500 transition">SkyTube</span>
            </a>
        </div>

        <div class="hidden md:flex items-center flex-1 max-w-xl mx-4">
            <div class="flex items-center w-full bg-[#121212] border border-borderdark rounded-l-full px-4 py-2 focus-within:border-blue-500">
                <input type="text" id="search-input" placeholder="Telusuri..." class="w-full bg-transparent text-white placeholder-gray-400 text-sm focus:outline-none">
            </div>
            <button id="search-btn" class="bg-surfacedark border border-l-0 border-borderdark px-6 py-2 rounded-r-full text-gray-300 hover:bg-hoverdark transition">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3">
            <button class="md:hidden p-2 hover:bg-hoverdark rounded-full text-gray-300">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button id="profile-btn" class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-white font-semibold text-sm shadow">
                AS
            </button>
        </div>
    </header>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-14 left-0 bottom-0 w-64 bg-darkbg border-r border-borderdark z-50 transform -translate-x-full transition-transform duration-200 ease-in-out flex flex-col overflow-y-auto p-3">
        <div class="space-y-1 pb-3 border-b border-borderdark">
            <a href="#" class="flex items-center space-x-6 px-3 py-2.5 rounded-xl bg-hoverdark text-white font-medium text-sm">
                <i class="fa-solid fa-house w-5 text-center text-red-500"></i>
                <span>Home</span>
            </a>
            <a href="#" class="flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-hoverdark text-gray-300 hover:text-white text-sm transition">
                <i class="fa-solid fa-bolt w-5 text-center"></i>
                <span>Shorts</span>
            </a>
        </div>
        <div class="pt-4 pb-8 mt-auto text-xs text-gray-400 space-y-2">
            <p class="px-1 text-[10px] text-gray-400">&copy; 2026 APONGSKY73</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 mt-14 mb-16 md:mb-0 transition-all duration-200 flex flex-col">
        <div class="max-w-7xl mx-auto px-4 py-6 w-full space-y-8">
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-fire text-red-500"></i>
                        <span>Rekomendasi & Hasil Pencarian</span>
                    </h3>
                </div>

                <!-- Video Grid Dinamis -->
                <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                    <div class="text-gray-400 text-sm">Memuat video dari YouTube...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Video Player Modal -->
    <div id="video-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-surfacedark border border-borderdark w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="flex items-center justify-between px-4 py-3 border-b border-borderdark">
                <h3 id="modal-title" class="font-bold text-white text-sm truncate">Pemutar SkyTube</h3>
                <button id="close-modal" class="text-gray-400 hover:text-white p-1.5 rounded-full hover:bg-hoverdark transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modal-player-container" class="relative aspect-video bg-black flex items-center justify-center">
            </div>
            <div class="p-4 space-y-2 bg-darkbg">
                <h4 id="modal-video-title" class="font-bold text-white text-base">Judul Video Disini</h4>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-16 md:bottom-6 right-6 bg-surfacedark border border-borderdark text-white px-4 py-2.5 rounded-xl text-xs shadow-xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">Notifikasi SkyTube</span>
    </div>

    <!-- YouTube.js Integration -->
    <script type="module">
        import { Innertube, UniversalCache } from 'https://esm.sh/youtubei.js@latest';

        let yt = null;

        const hamburgerBtn = document.getElementById('hamburger-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const videoModal = document.getElementById('video-modal');
        const closeModal = document.getElementById('close-modal');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }

        hamburgerBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        async function initYouTubeJS() {
            try {
                showToast("Menghubungkan ke YouTube...");
                yt = await Innertube.create({ cache: new UniversalCache(true) });
                showToast("SkyTube siap digunakan!");
                searchAndRender("Lofi music");
            } catch (error) {
                console.error("Gagal inisialisasi YouTube.js:", error);
                showToast("Gagal memuat sistem YouTube.");
            }
        }

        async function searchAndRender(query) {
            if (!yt) {
                showToast("Sistem belum siap, sebentar...");
                return;
            }

            try {
                showToast(`Mencari: "${query}"...`);
                const searchResults = await yt.search(query, { type: 'video' });
                renderVideos(searchResults.videos);
            } catch (err) {
                console.error("Gagal search:", err);
                showToast("Gagal mengambil data video.");
            }
        }

        function renderVideos(videos) {
            const videoGrid = document.getElementById('video-grid');
            videoGrid.innerHTML = '';

            videos.forEach(video => {
                const videoId = video.id;
                const title = video.title?.text || "Tanpa Judul";
                const channelTitle = video.author?.name || "Channel";
                const thumbUrl = video.thumbnails?.[0]?.url || "";
                const duration = video.duration?.text || "";

                const cardHTML = `
                    <div class="video-card group cursor-pointer space-y-3" onclick="window.playRealVideo('${videoId}', '${encodeURIComponent(title)}')">
                        <div class="relative aspect-video rounded-2xl overflow-hidden bg-surfacedark border border-borderdark">
                            <img src="${thumbUrl}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            ${duration ? `<div class="absolute bottom-2 right-2 bg-black/80 text-white text-[11px] font-medium px-2 py-0.5 rounded">${duration}</div>` : ''}
                        </div>
                        <div class="flex space-x-3">
                            <div class="w-9 h-9 rounded-full bg-red-600 flex-shrink-0 flex items-center justify-center text-white font-bold text-xs">YT</div>
                            <div class="flex-1 space-y-1">
                                <h4 class="text-sm font-semibold text-white line-clamp-2 group-hover:text-red-500 transition">${title}</h4>
                                <p class="text-xs text-gray-400">${channelTitle}</p>
                            </div>
                        </div>
                    </div>
                `;
                videoGrid.innerHTML += cardHTML;
            });
        }

        window.playRealVideo = function(videoId, encodedTitle) {
            const title = decodeURIComponent(encodedTitle);
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-video-title').textContent = title;

            const playerContainer = document.getElementById('modal-player-container');
            playerContainer.innerHTML = `
                <iframe class="w-full h-full" 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="YouTube video player" frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            videoModal.classList.remove('hidden');
        };

        closeModal.addEventListener('click', () => {
            videoModal.classList.add('hidden');
            document.getElementById('modal-player-container').innerHTML = '';
        });

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) searchAndRender(query);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) searchAndRender(query);
            }
        });

        initYouTubeJS();
    </script>
</body>
</html>
